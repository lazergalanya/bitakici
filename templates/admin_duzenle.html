<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Düzenle - BiTakıcı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0f0f0f;
            --accent-gold: #c5a059;
            --accent-gold-hover: #b08d46;
            --bg-color: #faf9f6;
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --text-muted: #777777;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); }
        
        header { background-color: var(--primary-dark); color: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(197, 160, 89, 0.3); }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5em; font-weight: 600; letter-spacing: 2px; color: var(--accent-gold); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        nav { display: flex; gap: 20px; align-items: center; }
        nav a { color: #d1d1d1; text-decoration: none; font-size: 0.9em; font-weight: 400; }
        .cart-btn { background-color: var(--accent-gold); color: #fff; padding: 8px 16px; border-radius: 30px; font-weight: 500; font-size: 0.85em; }

        .container { max-width: 700px; margin: 60px auto; padding: 30px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #eee; box-sizing: border-box; }
        h2 { font-family: 'Playfair Display', serif; color: var(--primary-dark); border-bottom: 2px solid var(--accent-gold); padding-bottom: 12px; margin-top: 0; font-size: 2em; font-weight: 500; }
        
        .admin-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; background: #faf8f3; padding: 25px; border-radius: 8px; border: 1px solid #eee; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { font-weight: 600; font-size: 0.85em; color: var(--primary-dark); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input, select, textarea { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.95em; background: #fff; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-gold); }
        textarea { resize: vertical; height: 100px; }
        
        .btn-submit { background-color: var(--primary-dark); color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95em; grid-column: span 2; text-align: center; transition: all 0.3s; }
        .btn-submit:hover { background-color: var(--accent-gold); color: #fff; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--text-muted); text-decoration: none; font-size: 0.9em; }
        .back-link:hover { color: var(--accent-gold); }

        footer { background-color: var(--primary-dark); color: #888; text-align: center; padding: 30px; margin-top: 100px; font-size: 0.85em; }
        footer p { margin: 0; letter-spacing: 1px; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">💎 BİTAKICI</a>
        <nav>
            <a href="/">Anasayfa</a>
            <a href="/urunler">Koleksiyon</a>
            <a href="/admin">Yönetici Paneli</a>
            <a href="/sepet" class="cart-btn">Sepet ({{ toplam_urun }})</a>
        </nav>
    </header>

    <div class="container">
        <a href="/admin" class="back-link">⬅ Yönetici Paneline Geri Dön</a>
        <h2>Ürün Düzenle</h2>
        
        <form action="/admin/urun-duzenle/{{ urun['id'] }}" method="POST" enctype="multipart/form-data" class="admin-form">
            <div class="form-group">
                <label for="ad">Ürün Adı</label>
                <input type="text" id="ad" name="ad" value="{{ urun['ad'] }}" required>
            </div>
            
            <div class="form-group">
                <label for="fiyat">Fiyat (TL)</label>
                <input type="number" step="0.01" id="fiyat" name="fiyat" value="{{ urun['fiyat'] }}" required>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="Kolye" {% if urun['kategori'] == 'Kolye' %}selected{% endif %}>Kolye</option>
                    <option value="Yüzük" {% if urun['kategori'] == 'Yüzük' %}selected{% endif %}>Yüzük</option>
                    <option, value="Küpe" {% if urun['kategori'] == 'Küpe' %}selected{% endif %}>Küpe</option>
                    <option value="Bileklik" {% if urun['kategori'] == 'Bileklik' %}selected{% endif %}>Bileklik</option>
                </select>
            </div>

            <div class="form-group">
                <label for="resim">Yeni Ürün Görseli (İsteğe Bağlı)</label>
                <input type="file" id="resim" name="resim" accept="image/*">
            </div>

            <div class="form-group full-width">
                <label for="aciklama">Ürün Açıklaması</label>
                <textarea id="aciklama" name="aciklama">{{ urun['aciklama'] }}</textarea>
            </div>

            <button type="submit" class="btn-submit">Değişiklikleri Kaydet</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 BiTakıcı & Aksesuar. Tüm hakları saklıdır.</p>
    </footer>
</body>
</html>
